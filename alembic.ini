# Alembic Configuration File
#
# This file is read by Alembic to determine how to connect to the database
# and where migration scripts are located.
#
# NOTE: sqlalchemy.url is intentionally left as a placeholder.
# The actual URL is loaded from app settings in migrations/env.py.

[alembic]
# Path to migration scripts directory
script_location = migrations

# Template used for generating new migration files
# file_template = %%(rev)s_%%(slug)s

# Timezone for migration create_date (UTC recommended)
# timezone =

# Max length of characters to apply to the "slug" field
# truncate_slug_length = 40

# Set to 'true' to run the environment during the 'revision' command
# revision_environment = false

# Placeholder — overridden by env.py with settings.database_url
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]
# Uncomment to run ruff on newly generated migration files
# hooks = ruff
# ruff.type = console_scripts
# ruff.entrypoint = ruff
# ruff.options = format REVISION_SCRIPT_FILENAME

# ── Logging ──────────────────────────────────────────────────

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
